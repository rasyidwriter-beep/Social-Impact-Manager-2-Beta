name: Deploy JEJAK ACEH to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "jejak-aceh/**"
      - ".github/workflows/deploy-jejak-aceh.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-jejak-aceh"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload JEJAK ACEH site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "jejak-aceh"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
