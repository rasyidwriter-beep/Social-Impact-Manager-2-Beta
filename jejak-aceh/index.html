<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#142b29">
<title>JEJAK ACEH — The Living Heritage</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Press+Start+2P&display=swap');
:root{--ink:#172c2b;--cream:#f4edda;--gold:#e9b95d;--green:#315c4b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142b29;color:var(--cream);font-family:Nunito,system-ui,sans-serif;touch-action:none}
#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#34594a,#142b29 70%)}
header{height:62px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #ffffff20;background:#102421dd;z-index:3}
.brand{display:flex;align-items:center;gap:10px}.sigil{width:36px;height:36px;border:2px solid var(--gold);border-radius:10px;display:grid;place-items:center;color:var(--gold);font-size:20px}.brand h1{font-size:16px;letter-spacing:2px;margin:0;font-weight:900}.brand small{display:block;color:#b4c5b1;font-size:9px;letter-spacing:2px;margin-top:2px}
.hud{display:flex;gap:8px;align-items:center}.pill{border:1px solid #ffffff25;background:#ffffff10;padding:8px 12px;border-radius:99px;font-size:11px;font-weight:900;color:var(--cream)}.pill b{color:var(--gold)}
main{position:relative;flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:12px}.shell{width:min(1100px,100%);height:100%;max-height:760px;position:relative;border:1px solid #d8c48a66;border-radius:16px;overflow:hidden;box-shadow:0 24px 70px #0007;background:#294b3b}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.top{position:absolute;z-index:2;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}.tag,.objective{background:#102b26df;border:1px solid #e9b95d66;padding:9px 12px;border-radius:10px;font-size:11px;font-weight:900;box-shadow:0 5px 15px #0003}.objective{max-width:260px;font-weight:700;line-height:1.4;border-color:#ffffff30}.objective strong{display:block;color:var(--gold);font-size:9px;letter-spacing:1.4px}
.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#102b26df;border:1px solid #ffffff30;border-radius:99px;padding:8px 14px;font-size:10px;white-space:nowrap;pointer-events:none}.hint span{color:var(--gold);font-weight:900}
.controls{position:absolute;inset:auto 18px 18px;display:none;justify-content:space-between;align-items:end;pointer-events:none}.joy{width:112px;height:112px;border-radius:50%;background:#102b2680;border:1px solid #ffffff55;position:relative;pointer-events:auto;touch-action:none}.knob{width:44px;height:44px;border-radius:50%;background:#e9b95dcc;border:2px solid #fff5;position:absolute;left:33px;top:33px}.actions{display:flex;gap:10px;pointer-events:auto;align-items:end}.act{width:58px;height:58px;border-radius:50%;background:#e9b95de8;color:#18332c;font-size:19px;font-weight:900;border:3px solid #fff5}.act.secondary{width:48px;height:48px;background:#173b34e8;color:#f4edda;font-size:14px}
.overlay{position:absolute;inset:0;z-index:5;background:#081a18c9;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(5px)}.panel{width:min(520px,100%);max-height:90%;overflow:auto;background:linear-gradient(145deg,#f5eedc,#e6ddc4);color:#1b342d;border:3px solid #d7ae5b;border-radius:17px;padding:22px;box-shadow:0 20px 60px #0008}.eyebrow{color:#8b6a2e;font-size:10px;letter-spacing:2px;font-weight:900}.panel h2{font-size:23px;margin:8px 0}.panel p{font-size:14px;line-height:1.6}.entry{border-top:1px solid #c7bda5;padding:12px 0}.entry strong{display:block}.entry small{color:#786b52;line-height:1.5}.panel button{background:#285542;color:#fff;border-radius:10px;padding:11px 18px;font-weight:900;margin-top:12px}
footer{height:25px;flex:none;text-align:center;color:#9eb2a3;font-size:9px;letter-spacing:.5px;padding:5px}
@media(max-width:650px){header{height:55px;padding:0 10px}.brand h1{font-size:13px}.brand small{font-size:8px}.sigil{width:31px;height:31px}.pill{padding:7px 9px;font-size:9px}.shell{border-radius:10px}.top{top:9px;left:9px;right:9px}.tag,.objective{font-size:9px;padding:7px 9px}.objective{max-width:155px}.hint{bottom:137px;font-size:9px}.controls{display:flex}.panel{padding:17px}.panel h2{font-size:20px}}
@media(min-width:651px){.controls{display:none!important}}
</style></head>
<body><div id="app">
<header><div class="brand"><div class="sigil">✦</div><div><h1>JEJAK ACEH</h1><small>THE LIVING HERITAGE</small></div></div><div class="hud"><div class="pill">✧ <b id="count">0</b> TEMUAN</div><button class="pill" id="journalBtn">▤ JURNAL</button></div></header>
<main><div class="shell"><canvas id="game" width="960" height="600"></canvas><div class="top"><div class="tag">⌖ GAMPONG PUSAKA</div><div class="objective"><strong>MISI AKTIF</strong><span id="objective">Temui tetua gampong di halaman rumah.</span></div></div><div class="hint" id="hint">Gunakan <span>WASD / tombol panah</span> untuk bergerak · Dekati warga untuk berinteraksi</div>
<div class="controls"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="actions"><button class="act secondary" id="journalTouch">▤</button><button class="act" id="interact">✦</button></div></div>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div></div></main><footer>PROTOTIPE INTERAKTIF • VERSI 0.1 • KONTEN BUDAYA PERLU VALIDASI SUMBER LOKAL</footer></div>
<script>
(()=>{
const c=document.getElementById('game'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
const W=960,H=600,player={x:470,y:390,dir:'down',walk:0},keys={},joy={x:0,y:0};
let found=new Set(),completed=new Set(),near=null,dialog=null,cam={x:0,y:0};
const npcs=[{id:'elder',x:475,y:220,name:'Teungku Hasan',role:'Tetua Gampong',color:'#315d78',lines:['Assalamu’alaikum, anak muda. Gampong ini menyimpan banyak cerita.','Cobalah telusuri rumah, benda pusaka, dan keterampilan warga. Setiap benda punya kisah.'],done:'Mulailah dengan mengamati Rumoh Aceh di sebelah barat.'},{id:'maker',x:710,y:335,name:'Cut Rahmah',role:'Perajin',color:'#8d4f63',lines:['Kerajinan tradisional bukan sekadar benda hias. Ada keterampilan dan pengetahuan yang diwariskan.','Amati alat dan hasil kerajinan di sekitar tempat kerjaku.'],done:'Teruslah bertanya kepada warga agar pengetahuan tidak hilang.'},{id:'seller',x:300,y:445,name:'Maimunah',role:'Pedagang kuliner',color:'#a46a35',lines:['Makanan Aceh punya cerita tentang bahan, rasa, dan kebiasaan masyarakat.'],done:'Catat nama makanan dan konteks asalnya.'}];
const objects=[{id:'rumoh',x:210,y:170,name:'Rumoh Aceh',kind:'Bangunan',title:'Mengenal Rumoh Aceh',desc:'Rumoh Aceh dikenal sebagai rumah tradisional masyarakat Aceh yang berbentuk rumah panggung. Bentuk dan susunan ruangnya berkaitan dengan adaptasi lingkungan serta kehidupan sosial masyarakat.',task:'Periksa bagian rumah dan temukan informasi arsitekturnya.',reward:'Arsitektur Rumoh Aceh'},{id:'rencong',x:745,y:265,name:'Pusaka Rencong',kind:'Artefak',title:'Jejak Rencong',desc:'Rencong merupakan senjata tradisional yang menjadi salah satu ikon budaya Aceh. Bentuk, penggunaan, dan maknanya perlu dipahami dalam konteks sejarah serta masyarakat Aceh.',task:'Temukan benda pusaka di dekat balai.',reward:'Pengetahuan tentang rencong'},{id:'craft',x:700,y:390,name:'Alat Kerajinan',kind:'Kerajinan',title:'Keterampilan yang Diwariskan',desc:'Kerajinan tradisional merekam keterampilan, kreativitas, dan pengetahuan yang diwariskan antargenerasi. Jenis bahan, teknik, dan fungsi perlu ditelusuri melalui sumber lokal.',task:'Amati alat kerja di bengkel perajin.',reward:'Pengetahuan kerajinan'}];
function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}
function house(a,b,s=1){x.save();x.translate(a,b);x.scale(s,s);rect(-62,8,130,62,'#5a3d2e');rect(-72,0,150,18,'#7b4934');rect(-55,18,116,42,'#b78c61');rect(-45,28,18,20,'#2d4d4a');rect(20,28,18,20,'#2d4d4a');rect(-8,34,24,36,'#69462f');rect(-83,-20,172,25,'#49302b');for(let i=0;i<9;i++)rect(-80+i*19,-29-(i%2)*4,16,13,'#674037');rect(-5,-55,16,29,'#674037');x.restore()}
function tree(a,b,r=25){rect(a-3,b+8,7,20,'#68482e');x.fillStyle='#245b3e';x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fill();x.fillStyle='#43834e';x.beginPath();x.arc(a-7,b-7,r*.68,0,Math.PI*2);x.fill();rect(a-12,b-12,5,4,'#83ad61')}
function person(a,b,col,isPlayer=false,frame=0){x.save();x.translate(a,b);rect(-8,2,6,10,'#293d50');rect(3,2,6,10,'#293d50');rect(-10,-13,20,19,col);rect(-7,-26,14,14,'#b87954');rect(-8,-29,16,6,'#282a27');if(isPlayer){x.strokeStyle='#f5d276';x.lineWidth=2;x.strokeRect(-14,-33,28,51)}x.restore()}
function drawWorld(){rect(0,0,W,H,'#6d9b5a');for(let yy=0;yy<H;yy+=32)for(let xx=0;xx<W;xx+=32){let n=(Math.sin(xx*12.9+yy*78.2)*43758.5)%1;rect(xx+((n*7)|0),yy+((n*5)|0),2,2,n>0?'#88b86a':'#5b874f')}
rect(0,520,W,80,'#4f9a9b');for(let i=0;i<30;i++)rect(i*37,535+(i%3)*15,20,2,'#83c3b5');
rect(0,300,960,34,'#c6ad7e');rect(0,310,960,14,'#e0c99a');rect(400,0,34,600,'#c6ad7e');rect(410,0,14,600,'#e0c99a');
for(let i=0;i<14;i++){tree(i*72+15,40+(i%2)*18,18);tree(i*72+15,480+(i%3)*7,19)}
house(165,135,1.25);house(610,155,1.05);house(90,385,.75);house(620,390,.8);
rect(405,130,150,66,'#80573d');rect(395,121,170,14,'#563e31');rect(414,139,130,50,'#c7a071');rect(432,150,25,39,'#614632');rect(480,149,22,18,'#4d7a70');rect(520,149,17,18,'#4d7a70');
for(let i=0;i<4;i++){rect(40+i*40,275,30,22,'#8a7048');for(let j=0;j<3;j++)rect(45+i*40+j*8,280,4,12,'#47784b')}
rect(805,325,6,38,'#65472f');rect(775,310,68,25,'#9b7547');rect(780,315,58,15,'#ead4a4');
for(let a of [365,580,830]){rect(a,344,3,24,'#684b34');rect(a-5,340,13,12,'#e4b75c');rect(a-2,343,7,6,'#ffe49a')}
}
function draw(){x.clearRect(0,0,W,H);x.save();x.translate(-cam.x,-cam.y);drawWorld();objects.forEach(o=>{if(o.id==='rumoh'){x.fillStyle='#f1c46a';x.fillRect(o.x-5,o.y+48,10,10)}else if(o.id==='rencong'){rect(o.x-8,o.y-5,16,16,'#d6b66d');rect(o.x-2,o.y-13,4,12,'#785333')}else{rect(o.x-9,o.y-7,18,13,'#d8b77c');rect(o.x-5,o.y-11,10,5,'#8e5b42')}});
npcs.forEach(n=>{person(n.x,n.y,n.color);x.fillStyle='#17362e';x.font='bold 12px Nunito';x.textAlign='center';x.fillText(n.name,n.x,n.y-34)});
person(player.x,player.y,'#2e725c',true,player.walk);if(near){x.strokeStyle='#ffe18a';x.lineWidth=2;x.beginPath();x.arc(near.x,near.y-10,22+Math.sin(Date.now()/180)*2,0,Math.PI*2);x.stroke()}x.restore()}
function proximity(){near=null;let best=66;[...npcs,...objects].forEach(o=>{let d=Math.hypot(player.x-o.x,player.y-o.y);if(d<best){best=d;near=o}});document.getElementById('hint').innerHTML=near?'Tekan <span>F / ✦</span> untuk berinteraksi dengan '+near.name:'Gunakan <span>WASD / tombol panah</span> untuk bergerak · Dekati warga untuk berinteraksi'}
function panel(html){document.getElementById('panel').innerHTML=html;document.getElementById('overlay').style.display='flex'}
function closePanel(){document.getElementById('overlay').style.display='none'}
function journal(){let entries=objects.filter(o=>found.has(o.id));panel('<div class="eyebrow">CATATAN PENJELAJAH</div><h2>Jurnal Budaya</h2><p>Setiap penemuan menyimpan satu potongan cerita tentang warisan budaya Aceh.</p>'+(entries.length?entries.map(o=>'<div class="entry"><strong>✦ '+o.title+'</strong><small>'+o.desc+'</small></div>').join(''):'<div class="entry"><strong>Jurnal masih kosong</strong><small>Jelajahi gampong dan periksa objek budaya untuk mengumpulkan catatan pertamamu.</small></div>')+'<button onclick="window.closePanel()">Kembali ke permainan</button>')}
window.closePanel=closePanel;
function interact(){if(!near)return;if(npcs.includes(near)){let n=near,first=!completed.has(n.id);panel('<div class="eyebrow">'+n.role.toUpperCase()+'</div><h2>'+n.name+'</h2><p>'+(first?n.lines.join('</p><p>'):n.done)+'</p><button onclick="window.finishNpc(\''+n.id+'\')">'+(first?'Mengerti':'Lanjutkan')+'</button>');return}
let o=near,first=!found.has(o.id);panel('<div class="eyebrow">PENEMUAN BUDAYA · '+o.kind.toUpperCase()+'</div><h2>'+o.title+'</h2><p>'+o.desc+'</p><p><strong>Catatan:</strong> '+o.task+'</p><button onclick="window.discover(\''+o.id+'\')">'+(first?'Simpan ke jurnal':'Tutup')+'</button>')}
window.finishNpc=id=>{completed.add(id);closePanel();if(id==='elder')document.getElementById('objective').textContent='Jelajahi Rumoh Aceh dan temukan tiga catatan budaya.'};
window.discover=id=>{found.add(id);document.getElementById('count').textContent=found.size;document.getElementById('objective').textContent=found.size===3?'Semua temuan awal terkumpul. Jelajahi dan lengkapi jurnal budaya.':'Temukan '+(3-found.size)+' catatan budaya lainnya.';closePanel()};
function update(){let dx=(keys.ArrowLeft||keys.a||keys.A?-1:0)+(keys.ArrowRight||keys.d||keys.D?1:0)+joy.x,dy=(keys.ArrowUp||keys.w||keys.W?-1:0)+(keys.ArrowDown||keys.s||keys.S?1:0)+joy.y;let l=Math.hypot(dx,dy);if(l>.1){dx/=Math.max(1,l);dy/=Math.max(1,l);player.x=Math.max(30,Math.min(930,player.x+dx*2.7));player.y=Math.max(45,Math.min(500,player.y+dy*2.7));player.walk+=.2;player.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')}cam.x=Math.max(0,Math.min(0,player.x-480));cam.y=Math.max(0,Math.min(0,player.y-300));proximity();draw();requestAnimationFrame(update)}
document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='f'||e.key==='F'||e.key===' ')interact();if(e.key==='Escape')closePanel()});document.addEventListener('keyup',e=>keys[e.key]=false);
document.getElementById('journalBtn').onclick=journal;document.getElementById('journalTouch').onclick=journal;document.getElementById('interact').onclick=interact;
const joyEl=document.getElementById('joy'),knob=document.getElementById('knob');let active=false;function joyMove(e){let r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy),max=33;if(m>max){dx=dx/m*max;dy=dy/m*max}joy.x=dx/max;joy.y=dy/max;knob.style.transform='translate('+dx+'px,'+dy+'px)'}function joyEnd(){active=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}joyEl.addEventListener('pointerdown',e=>{active=true;joyEl.setPointerCapture(e.pointerId);joyMove(e)});joyEl.addEventListener('pointermove',e=>{if(active)joyMove(e)});joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
update();
})();
</script></body></html>
